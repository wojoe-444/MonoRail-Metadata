# Table and column lineage parsed from BigQuery query history and view definitions.
#   metadata ingest -c deploy/openmetadata/ingestion/bigquery-lineage.yaml
source:
  type: bigquery-lineage
  serviceName: bigquery
  serviceConnection:
    config:
      type: BigQuery
      credentials:
        gcpConfig:
          type: gcp_adc
          projectId: acme-analytics
      usageLocation: us
  sourceConfig:
    config:
      type: DatabaseLineage
      queryLogDuration: 7
      resultLimit: 10000
      processViewLineage: true
      processQueryLineage: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  openMetadataServerConfig:
    hostPort: http://localhost:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_INGESTION_JWT}
