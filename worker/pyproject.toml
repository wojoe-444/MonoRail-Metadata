[project]
name = "monorail-worker"
version = "0.1.0"
description = "The team-backend worker for MonoRail Metadata: applies queued requests to OpenMetadata and publishes the catalog to a bucket (docs/team-backend.md)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "google-auth[requests]>=2.29",
  "google-cloud-storage>=2.16",
  "google-cloud-bigquery>=3.25",
]

[project.scripts]
monorail-worker = "monorail_worker.cli:main"

[project.optional-dependencies]
vertex = [
    "google-cloud-aiplatform>=1.60",
]

[dependency-groups]
dev = ["pytest>=8.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/monorail_worker"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["error::pytest.PytestUnhandledThreadExceptionWarning"]
markers = ["integration: needs a running OpenMetadata (skipped when it isn't reachable)"]
